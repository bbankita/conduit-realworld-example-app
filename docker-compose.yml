services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit
      POSTGRES_DB: conduit
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit -d conduit"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_KEY: ${JWT_KEY:-local-test-secret}
      PROD_DB_USERNAME: conduit
      PROD_DB_PASSWORD: conduit
      PROD_DB_NAME: conduit
      PROD_DB_HOSTNAME: db
      PROD_DB_DIALECT: postgres
    ports:
      - "3001:3001"   # UI at http://localhost:3001 , API at http://localhost:3001/api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/tags').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  db-data: